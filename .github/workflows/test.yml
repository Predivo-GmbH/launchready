# =============================================================================
# Test & Coverage — GitHub Actions Workflow
# =============================================================================

name: Test & Coverage

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # ----- Checkout & Setup -----

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ----- Lint -----
      - name: Lint
        run: npm run lint

      # ----- Unit Tests -----
      - name: Unit Tests
        run: npm run test:ci

      # ----- Coverage Report -----
      - name: Coverage
        run: npm run test:coverage

      # ----- E2E Tests -----
      - name: Build for E2E
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Critical Path E2E (MUST PASS)
        run: npx playwright test e2e/critical-path.spec.ts

      - name: E2E Tests
        run: npm run test:e2e
        continue-on-error: true

      # ----- Accessibility Tests -----
      - name: Accessibility Tests
        run: npm run test:a11y
        continue-on-error: true

      # ----- Feature Coverage Check -----
      - name: Feature Coverage Check
        run: node scripts/check-feature-coverage.mjs
        continue-on-error: true
