name: Build & Deploy

# STAGING-FIRST PIPELINE — production is a deliberate, gated promotion, never
# an automatic side-effect of pushing to master. Pushes to `staging` deploy to
# staging.launchready.predivo.ch (see deploy-staging.yml) for review; shipping
# to production requires a manual workflow_dispatch with confirm="deploy" typed
# in, exactly like Valrano/SignalScore. Same build/test/FTP machinery as before.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm PRODUCTION deploy'
        required: true
        default: ''

concurrency:
  group: deploy-production
  # Serialize deploys: queued, never cancelled mid-run — cancel-in-progress left
  # prod half-applied when rapid pushes superseded each other mid-FTP-mirror
  # (see standards/deploy-standard.md; Audits/BREAKAGE_ROOT_CAUSE_INVESTIGATION_2026-07-14.md §8).
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # SECURITY GATE (G3, deploy-standard §4d) — blocks prod promotion. gitleaks
  # full-history secret scan + `npm audit --audit-level=high`. AI
  # security-review stays advisory. Fleet retrofit 2026-08-17 (clean at high).
  # ===========================================================================
  gate-security:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: 'Secret scan: working tree (BLOCKING - new committed-file leaks)'
        run: /tmp/gitleaks dir . --no-banner --redact --exit-code 1
      - name: 'Secret scan: full history (BLOCKING - historical secrets dead since 2026-07-09 legacy-key disable, allowlisted in .gitleaksignore)'
        run: /tmp/gitleaks git . --no-banner --redact --log-opts=--all --exit-code 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Dependency audit (blocking at high; launchready has 0 high, so tightened from critical 2026-08-17)
        run: npm audit --audit-level=high
      - name: Feature coverage gate (wire the previously-orphaned coverage script; blocking)
        run: node scripts/check-feature-coverage.mjs
      # SAST — code-level security (fleet-hardening Wave 2, proven route from project-starter).
      # A different layer than npm audit (deps) + gitleaks (secrets in git): semgrep reads OUR
      # code for injection / XSS / hardcoded secrets. `.semgrepignore` excludes test/dev files
      # (example tokens + fixtures = false positives). --severity=ERROR = highest confidence;
      # --error fails the gate on a real finding.
      - name: SAST scan (semgrep)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config=p/security-audit --config=p/secrets --severity=ERROR --error --metrics=off .

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    needs: [gate-security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # standards/deploy-standard.md §5 — Node 22 (package.json has no `engines` restriction)
          cache: npm

      # Database BEFORE build/FTP: apply pending SQL migrations to prod so the
      # site never ships ahead of its schema (BackOffice pattern, 2026-08-21).
      - name: Apply database migrations (prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref hcfeoescybfngjsphekq

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests against static export
        run: npx playwright test
        env:
          CI: true

      - name: Deploy via FTP (zero-downtime)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          # set +e: GitHub runs steps with bash -e, which aborts OUT=$(lftp…) on the
          # first failure BEFORE the retry loops below can iterate (dead-retry, deploy-standard §3f).
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          LFTP_SETTINGS="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4;"

          echo "launchready" > ./out/.site-id

          REMOTE_ID=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP_GUARD
            $LFTP_SETTINGS
            cat /launchready.predivo.ch/.site-id
            quit
          LFTP_GUARD
          ) 2>/dev/null || REMOTE_ID=""
          # An EMPTY id is not a match failure, so `-n` below let it through - which is exactly
          # what a 530, a timeout or a dropped connection produces. The guard cannot tell those
          # apart from "file absent", so it must not deploy blind. Every live target has a seeded
          # .site-id (all 13 verified reading non-empty on 2026-08-23); a genuinely new target must
          # have its .site-id seeded first. Copied in spirit from Valrano, which had this right.
          if [ -z "$REMOTE_ID" ]; then
            echo "::error::Site-id guard INCONCLUSIVE: read no .site-id (timeout, dropped connection, bad credential or missing file - indistinguishable). Refusing to deploy blind."
            exit 1
          fi
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "launchready" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'launchready'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"

          # Step 1: Upload new hashed assets alongside old ones (no deletion yet)
          # Retry loop (deploy-standard.md §3): mirror is resumable, so a transient
          # blip just retries. A 530 (bad login) fails fast — it's a stale secret,
          # not a transient network issue, so retrying wastes 100s for nothing.
          n=0
          until [ $n -ge 4 ]; do
          OUT=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP_EOF 2>&1
            $LFTP_SETTINGS
            mirror --reverse --no-perms --verbose ./out/_next/ /launchready.predivo.ch/_next/
            quit
          LFTP_EOF
          )
          RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] && { echo "Step 1 (hashed assets) upload ok (attempt $((n+1)))"; break; }
          echo "$OUT" | grep -qiE '530|login (incorrect|failed)' && { echo "::error::FTP auth failed (530) — stale FTP secret, not transient; not retrying."; exit 1; }
          n=$((n+1)); [ $n -ge 4 ] && { echo "::error::Step 1 (hashed assets) upload failed after 4 attempts"; exit 1; }
          echo "::warning::Step 1 attempt $n failed (transient); retrying in 25s..."; sleep 25
          done

          # Step 2: Full mirror of everything (HTML, images, etc.)
          # --delete removes stale files on server.
          n=0
          until [ $n -ge 4 ]; do
          OUT=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP_EOF 2>&1
            $LFTP_SETTINGS
            mirror --reverse --delete --no-perms --verbose ./out/ /launchready.predivo.ch/
            quit
          LFTP_EOF
          )
          RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] && { echo "Step 2 (full mirror) upload ok (attempt $((n+1)))"; break; }
          echo "$OUT" | grep -qiE '530|login (incorrect|failed)' && { echo "::error::FTP auth failed (530) — stale FTP secret, not transient; not retrying."; exit 1; }
          n=$((n+1)); [ $n -ge 4 ] && { echo "::error::Step 2 (full mirror) upload failed after 4 attempts"; exit 1; }
          echo "::warning::Step 2 attempt $n failed (transient); retrying in 25s..."; sleep 25
          done

          # Step 3: Verify file landed via FTP (cheap sanity check; the authoritative
          # check is the HTTP-200 curl in the next step, which proves Apache actually
          # serves the site — not just that the file was uploaded).
          n=0
          until [ $n -ge 4 ]; do
          OUT=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP_EOF 2>&1
            $LFTP_SETTINGS
            ls /launchready.predivo.ch/index.html
            quit
          LFTP_EOF
          )
          RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] && { echo "Step 3 (FTP file check) ok (attempt $((n+1)))"; break; }
          echo "$OUT" | grep -qiE '530|login (incorrect|failed)' && { echo "::error::FTP auth failed (530) — stale FTP secret, not transient; not retrying."; exit 1; }
          n=$((n+1)); [ $n -ge 4 ] && { echo "::error::Step 3 (FTP file check) failed after 4 attempts"; exit 1; }
          echo "::warning::Step 3 attempt $n failed (transient); retrying in 25s..."; sleep 25
          done

      - name: Verify site is live (HTTP 200)
        # Real end-to-end proof: FTP "ls" only proves the file was uploaded, not
        # that Apache is actually serving it (wrong .htaccess, permissions, or a
        # 500 would still pass an FTP file-exists check). Retry loop per
        # deploy-standard.md §3d — survives transient curl failures, not just non-200s.
        run: |
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://launchready.predivo.ch/ --max-time 30 || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Production site is live (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::Production check attempt $i/6 got HTTP $STATUS - retrying in 15s..."
            sleep 15
          done
          echo "::error::https://launchready.predivo.ch/ returned HTTP $STATUS after 6 attempts - deploy landed but site is not serving 200."
          exit 1
