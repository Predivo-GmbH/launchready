name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy via FTP (zero-downtime)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get install -y lftp
          LFTP_SETTINGS="set ftp:ssl-allow yes; set ssl:verify-certificate no; set ftp:passive-mode yes; set net:max-retries 3; set net:reconnect-interval-base 5;"

          # Step 1: Upload new hashed assets alongside old ones (no deletion yet)
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP_EOF
            $LFTP_SETTINGS
            mirror --reverse --no-perms --verbose ./out/_next/ /LaunchReady.predivo.ch/_next/
            quit
          LFTP_EOF

          # Step 2: Full mirror of everything (HTML, images, etc.)
          # --delete removes stale files on server.
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP_EOF
            $LFTP_SETTINGS
            mirror --reverse --delete --no-perms --verbose ./out/ /LaunchReady.predivo.ch/
            quit
          LFTP_EOF

          # Step 3: Verify deploy landed
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP_EOF
            $LFTP_SETTINGS
            ls -la /
            ls /LaunchReady.predivo.ch/index.html
            quit
          LFTP_EOF
